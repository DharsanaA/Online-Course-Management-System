{% extends "base.html" %}
{% block title %}{{ code }} · {{ title }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-primary">{{ code }}</div>
  <h1 class="h3 mb-2">{{ title }}</h1>
  <p class="text-secondary mb-4">{{ message }}</p>
  <div class="d-flex justify-content-center gap-2">
    <a class="btn btn-primary" href="{{ url_for('courses.home') }}">Go to home</a>
    {% if user %}<a class="btn btn-outline-primary" href="{{ url_for('notifications.index') }}">Notifications</a>{% endif %}
  </div>
</div>
{% endblock %}
